name: Orbis Education
description: Orbis Education is a healthcare education services company founded in 2003 that
  partners with universities and healthcare systems to create, market, and manage collaborative,
  accelerated healthcare degree programs — including Accelerated Bachelor of Science in Nursing
  (ABSN), Medical Laboratory Sciences (MLS), and Occupational Therapy Assistant (OTA) programs —
  to help address workforce shortages in nursing and allied health. Operating across more than 26
  states, the company connects students with universities and clinical placement sites to graduate
  practice-ready professionals, and was acquired by Grand Canyon Education in 2018. Orbis Education
  is a services provider and does not publish a public API, developer portal, or developer
  documentation.
